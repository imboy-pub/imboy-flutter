appId: ${APP_ID}
name: "设置与安全入口"
tags:
  - smoke
  - read-only
onFlowStart:
  - runFlow: 01_login.yaml
---
- tapOn:
    id: "tab_mine"
- scrollUntilVisible:
    element:
      text: "设置"
    direction: DOWN
- tapOn:
    text: "设置"
- waitForAnimationToEnd
- assertVisible:
    text: "账号安全"
- takeScreenshot: settings_navigation

# 常规设置：只打开页面，不修改选项
- tapOn:
    text: "账号安全"
- waitForAnimationToEnd
- assertVisible:
    text: "账号安全"
- takeScreenshot: account_security
- back

- tapOn:
    text: "语言设置"
- waitForAnimationToEnd
- assertVisible:
    text: "语言设置"
- takeScreenshot: language_settings
- back

- tapOn:
    text: "深色模式"
- waitForAnimationToEnd
- assertVisible:
    text: "深色模式"
- takeScreenshot: dark_mode_settings
- back

- tapOn:
    text: "字体大小设置"
- waitForAnimationToEnd
- assertVisible:
    text: "字体大小设置"
- takeScreenshot: font_size_settings
- back

# E2EE 密钥页：只验证入口，不刷新、备份、恢复或删除密钥
- scrollUntilVisible:
    element:
      text: "E2EE 密钥管理"
    direction: DOWN
- tapOn:
    text: "E2EE 密钥管理"
- waitForAnimationToEnd
- assertVisible:
    text: "端到端加密密钥管理"
- takeScreenshot: e2ee_key_management
- back

# 帮助与关于
- scrollUntilVisible:
    element:
      text: "更新日志"
    direction: DOWN
- tapOn:
    text: "更新日志"
- waitForAnimationToEnd
- assertVisible:
    text: "更新日志"
- takeScreenshot: update_log
- back

- scrollUntilVisible:
    element:
      text: "帮助文档"
    direction: DOWN
- tapOn:
    text: "帮助文档"
- waitForAnimationToEnd
- assertVisible:
    text: "帮助文档"
- takeScreenshot: help_document
- back

- scrollUntilVisible:
    element:
      text: "隐私政策"
    direction: DOWN
- tapOn:
    text: "隐私政策"
- waitForAnimationToEnd
- assertVisible:
    text: "隐私政策"
- takeScreenshot: privacy_policy
- back

- scrollUntilVisible:
    element:
      text: "关于应用"
    direction: DOWN
- tapOn:
    text: "关于应用"
- waitForAnimationToEnd
- assertVisible:
    text: "关于 .*"
- takeScreenshot: about_app
- back
- back

