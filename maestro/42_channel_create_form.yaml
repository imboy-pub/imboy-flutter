appId: ${APP_ID}
name: "频道创建表单"
tags:
  - smoke
  - read-only
  - form-preview
  - feature-flag
onFlowStart:
  - runFlow: 01_login.yaml
---
# 频道受功能开关控制；只查看创建表单，不选头像、不填写或确认创建
- runFlow:
    when:
      visible:
        id: "tab_channel"
    commands:
      - tapOn:
          id: "tab_channel"
      - extendedWaitUntil:
          visible:
            text: "已订阅"
          timeout: 15000
      - tapOn:
          text: "创建频道"
      - waitForAnimationToEnd
      - assertVisible:
          text: "频道名称"
      - assertVisible:
          text: "频道描述"
      - assertVisible:
          text: "自定义ID（选填）"
      - takeScreenshot: channel_create_form_top_read_only
      - scrollUntilVisible:
          element:
            text: "频道类型"
          direction: DOWN
      - assertVisible:
          text: "公开"
      - assertVisible:
          text: "私有"
      - assertVisible:
          text: "任何人都可以搜索到并订阅你的频道"
      - takeScreenshot: channel_create_type_read_only
      - back
      - tapOn:
          id: "tab_conversations"

