appId: ${APP_ID}
name: "联系人标签搜索"
tags:
  - smoke
  - read-only
onFlowStart:
  - runFlow: 01_login.yaml
---
- tapOn:
    id: "tab_contacts"
- scrollUntilVisible:
    element:
      text: "标签"
    direction: DOWN
- tapOn:
    text: "标签"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "联系人标签"
    timeout: 15000
- assertVisible:
    text: "搜索"

# 只搜索标签，不新增、重命名、删除或拖动排序
- tapOn:
    text: "搜索"
- inputText: "Maestro"
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: contact_tag_search_read_only
- tapOn:
    text: "Maestro"
    index: 0
- eraseText: 30
- hideKeyboard
- takeScreenshot: contact_tags_restored
- back
