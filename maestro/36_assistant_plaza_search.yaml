appId: ${APP_ID}
name: "AI 助手广场搜索"
tags:
  - smoke
  - read-only
onFlowStart:
  - runFlow: 01_login.yaml
---
- tapOn:
    id: "tab_contacts"
- scrollUntilVisible:
    element:
      text: "AI 助手广场"
    direction: DOWN
- tapOn:
    text: "AI 助手广场"
- waitForAnimationToEnd
- assertVisible:
    text: "AI 助手广场"
- assertVisible:
    text: "这里的成员都是 AI 助手，身份会明确标注；加密聊天里，只有真人。"
- assertVisible:
    text: "搜索助手"

# 搜索只读取助手目录，不打开助手会话或发送消息
- tapOn:
    text: "搜索助手"
- inputText: "Maestro"
- hideKeyboard
- extendedWaitUntil:
    visible:
      text: "(无匹配的助手|发消息|load_failed)"
    timeout: 15000
- takeScreenshot: assistant_plaza_search_read_only
- tapOn:
    text: "Maestro"
    index: 0
- eraseText: 30
- hideKeyboard
- back

