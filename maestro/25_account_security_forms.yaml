appId: ${APP_ID}
name: "账号绑定表单预览"
tags:
  - smoke
  - read-only
  - sensitive-preview
onFlowStart:
  - runFlow: 01_login.yaml
---
- tapOn:
    id: "tab_mine"
- scrollUntilVisible:
    element:
      text: "设置"
    direction: DOWN
- tapOn:
    text: "设置"
- waitForAnimationToEnd
- tapOn:
    text: "账号安全"
- waitForAnimationToEnd
- assertVisible:
    text: "绑定邮箱"
- assertVisible:
    text: "绑定手机号"
- takeScreenshot: account_security_credentials

# 仅检查邮箱表单，不输入邮箱、验证码或请求验证码
- tapOn:
    text: "绑定邮箱"
- waitForAnimationToEnd
- assertVisible:
    text: "(绑定|修改)邮箱"
- assertVisible:
    text: "当前邮箱"
- assertVisible:
    text: "请输入邮箱地址"
- assertVisible:
    text: "验证码"
- takeScreenshot: bind_email_form_read_only
- back

# 仅检查手机号表单，不输入手机号、验证码或请求验证码
- tapOn:
    text: "绑定手机号"
- waitForAnimationToEnd
- assertVisible:
    text: "(绑定|更换)手机号"
- assertVisible:
    text: "当前手机号"
- assertVisible:
    text: "请输入手机号"
- assertVisible:
    text: "验证码"
- takeScreenshot: bind_mobile_form_read_only
- back
- back

