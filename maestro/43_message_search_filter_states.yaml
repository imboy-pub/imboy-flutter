appId: ${APP_ID}
name: "消息搜索筛选交互"
tags:
  - smoke
  - read-only
  - local-state
onFlowStart:
  - runFlow: 01_login.yaml
---
- tapOn:
    id: "tab_conversations"
- tapOn:
    text: "搜索"
    index: 0
- waitForAnimationToEnd
- tapOn:
    text: "输入关键词搜索消息"
- inputText: "Maestro"
- hideKeyboard
- extendedWaitUntil:
    visible:
      text: "私聊"
    timeout: 10000

# 筛选只读取本地消息索引，不打开搜索结果或发送消息
- tapOn:
    text: "私聊"
- waitForAnimationToEnd
- takeScreenshot: message_search_private_filter
- tapOn:
    text: "群聊"
- waitForAnimationToEnd
- takeScreenshot: message_search_group_filter
- tapOn:
    text: "今天"
- waitForAnimationToEnd
- takeScreenshot: message_search_today_filter
- tapOn:
    text: "所有时间"
- waitForAnimationToEnd
- takeScreenshot: message_search_filters_restored
- back

