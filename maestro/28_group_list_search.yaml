appId: ${APP_ID}
name: "群聊列表搜索与角色筛选"
tags:
  - smoke
  - read-only
onFlowStart:
  - runFlow: 01_login.yaml
---
- tapOn:
    id: "tab_contacts"
- scrollUntilVisible:
    element:
      text: "群聊"
    direction: DOWN
- tapOn:
    text: "群聊"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "群聊.*"
    timeout: 15000

# 角色筛选器始终可见；这里只校验入口，不触发刷新或群内操作
- assertVisible:
    text: "全部"
- assertVisible:
    text: "我加入"
- assertVisible:
    text: "我管理"
- assertVisible:
    text: "我创建"

# 群名搜索为本地即时过滤，不打开任何群聊
- tapOn:
    text: "搜索"
- inputText: "Maestro"
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: group_list_search_read_only
- tapOn:
    text: "Maestro"
    index: 0
- eraseText: 30
- hideKeyboard
- takeScreenshot: group_list_role_filters
- back
