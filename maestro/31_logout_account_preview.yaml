appId: ${APP_ID}
name: "注销账号安全预览"
tags:
  - smoke
  - read-only
  - destructive-preview
onFlowStart:
  - runFlow: 01_login.yaml
---
- tapOn:
    id: "tab_mine"
- scrollUntilVisible:
    element:
      text: "设置"
    direction: DOWN
- tapOn:
    text: "设置"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "注销账号"
    direction: DOWN
- tapOn:
    text: "注销账号"
- waitForAnimationToEnd
- assertVisible:
    text: "注销账号"
- assertVisible:
    text: "导出我的数据"
- assertVisible:
    text: "导出你的个人信息、联系人和聊天记录"
- assertVisible:
    text: "已经阅读并同意注销账号"

# 不导出数据、不勾选同意，也不触发不可逆的注销确认
- takeScreenshot: logout_account_disabled_preview
- back
- back
