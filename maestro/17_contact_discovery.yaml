appId: ${APP_ID}
name: "联系人发现入口"
tags:
  - smoke
  - read-only
onFlowStart:
  - runFlow: 01_login.yaml
---
- tapOn:
    id: "tab_contacts"
- extendedWaitUntil:
    visible:
      text: "朋友圈"
    timeout: 15000
- takeScreenshot: contact_discovery

# 朋友圈（只查看，不发布、点赞或评论）
- tapOn:
    text: "朋友圈"
- waitForAnimationToEnd
- assertVisible:
    text: "朋友圈"
- takeScreenshot: moments_feed_read_only
- back

# AI 助手广场（只查看，不发起会话）
- scrollUntilVisible:
    element:
      text: "AI 助手广场"
    direction: DOWN
- tapOn:
    text: "AI 助手广场"
- waitForAnimationToEnd
- assertVisible:
    text: "AI 助手广场"
- takeScreenshot: assistant_plaza
- back

# 新好友申请列表（只查看，不接受或拒绝）
- scrollUntilVisible:
    element:
      text: "新的朋友"
    direction: DOWN
- tapOn:
    text: "新的朋友"
- waitForAnimationToEnd
- assertVisible:
    text: "新的朋友"
- takeScreenshot: new_friend_requests
- back

# 群聊列表
- scrollUntilVisible:
    element:
      text: "群聊"
    direction: DOWN
- tapOn:
    text: "群聊"
- waitForAnimationToEnd
- assertVisible:
    text: "群聊.*"
- takeScreenshot: group_list
- back

# 联系人标签（只查看，不新增、删除或排序）
- scrollUntilVisible:
    element:
      text: "标签"
    direction: DOWN
- tapOn:
    text: "标签"
- waitForAnimationToEnd
- assertVisible:
    text: "联系人标签"
- takeScreenshot: contact_tags
- back

