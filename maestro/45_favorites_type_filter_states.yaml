appId: ${APP_ID}
name: "收藏类型筛选交互"
tags:
  - smoke
  - read-only
onFlowStart:
  - runFlow: 01_login.yaml
---
- tapOn:
    id: "tab_mine"
- tapOn:
    text: "收藏"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "我的收藏"
    timeout: 15000
- tapOn:
    text: "类型"
- waitForAnimationToEnd

# ChoiceChip 切换只重新读取收藏列表，不打开、转发或删除收藏
- tapOn:
    text: "文本"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: favorites_text_filter
- tapOn:
    text: "图片"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: favorites_image_filter
- tapOn:
    text: "全部"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: favorites_type_filter_restored
- back

