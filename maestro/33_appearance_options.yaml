appId: ${APP_ID}
name: "语言、深色模式与字体预览"
tags:
  - smoke
  - read-only
onFlowStart:
  - runFlow: 01_login.yaml
---
- tapOn:
    id: "tab_mine"
- scrollUntilVisible:
    element:
      text: "设置"
    direction: DOWN
- tapOn:
    text: "设置"
- waitForAnimationToEnd

# 语言列表：只验证可选项，不切换语言
- tapOn:
    text: "语言设置"
- waitForAnimationToEnd
- assertVisible:
    text: "简体中文"
- assertVisible:
    text: "繁體中文"
- assertVisible:
    text: "Русский"
- assertVisible:
    text: "English"
- takeScreenshot: language_options_read_only
- back

# 深色模式：只读取当前设置
- tapOn:
    text: "深色模式"
- waitForAnimationToEnd
- assertVisible:
    text: "跟随系统"
- assertVisible:
    text: "开启后,将跟随系统打开或关闭深色模式"
- runFlow:
    when:
      visible:
        text: "系统默认"
    commands:
      - assertVisible:
          text: "深色模式"
- takeScreenshot: dark_mode_options_read_only
- back

# 字体大小：不拖动滑块
- tapOn:
    text: "字体大小设置"
- waitForAnimationToEnd
- assertVisible:
    text: "这是标题文本"
- assertVisible:
    text: "这是正文内容，您可以在这里看到不同字体大小的显示效果。"
- assertVisible:
    text: "这是辅助说明文字"
- assertVisible:
    text: "更小"
- assertVisible:
    text: "更大"
- takeScreenshot: font_size_preview_read_only
- back
- back

