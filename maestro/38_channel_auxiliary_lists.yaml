appId: ${APP_ID}
name: "频道订单与邀请列表"
tags:
  - smoke
  - read-only
  - feature-flag
  - financial-preview
onFlowStart:
  - runFlow: 01_login.yaml
---
# 频道及其低频菜单均受功能开关控制
- runFlow:
    when:
      visible:
        id: "tab_channel"
    commands:
      - tapOn:
          id: "tab_channel"
      - extendedWaitUntil:
          visible:
            text: "已订阅"
          timeout: 15000
      - takeScreenshot: channel_auxiliary_entry

      # Flutter PopupMenuButton 的中文无障碍标签
      - runFlow:
          when:
            visible:
              text: "显示菜单"
          commands:
            - tapOn:
                text: "显示菜单"
            - takeScreenshot: channel_auxiliary_menu

            # 我的订单：只查看，不打开订单详情或申请退款
            - runFlow:
                when:
                  visible:
                    text: "我的订单"
                commands:
                  - tapOn:
                      text: "我的订单"
                  - waitForAnimationToEnd
                  - assertVisible:
                      text: "我的订单"
                  - extendedWaitUntil:
                      visible:
                        text: "(暂无订单记录|待支付|已支付|已退款|已取消|已过期)"
                      timeout: 15000
                  - takeScreenshot: channel_orders_read_only
                  - back

            # 若订单页关闭了菜单，则重新打开以检查邀请入口
            - runFlow:
                when:
                  visible:
                    text: "显示菜单"
                commands:
                  - tapOn:
                      text: "显示菜单"

            # 频道邀请：只查看，不接受或拒绝
            - runFlow:
                when:
                  visible:
                    text: "频道邀请"
                commands:
                  - tapOn:
                      text: "频道邀请"
                  - waitForAnimationToEnd
                  - assertVisible:
                      text: "频道邀请"
                  - extendedWaitUntil:
                      visible:
                        text: "(我收到的|暂无收到的邀请|加载失败，请重试)"
                      timeout: 15000
                  - takeScreenshot: channel_invitations_read_only
                  - back

            # 如果只启用了订单功能，第二次打开的菜单仍在，先关闭
            - runFlow:
                when:
                  visible:
                    text: "我的订单"
                commands:
                  - back

      - tapOn:
          id: "tab_conversations"
