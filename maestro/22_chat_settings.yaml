appId: ${APP_ID}
name: "单聊设置与记录搜索"
tags:
  - smoke
  - read-only
  - requires-fixture
onFlowStart:
  - runFlow: 01_login.yaml
---
- tapOn:
    id: "tab_conversations"

# 使用已确认的测试好友定位单聊会话
- tapOn:
    id: "conversation_search_input"
- eraseText: 30
- inputText: "${FRIEND_ACCOUNT}"
- hideKeyboard
- waitForAnimationToEnd
- tapOn:
    index: 0
    id: ".*"

- assertVisible:
    id: "chat_message_input"
- tapOn:
    text: "聊天设置"
- waitForAnimationToEnd
- assertVisible:
    text: "消息免打扰"
- assertVisible:
    text: "阅后即焚"
- assertVisible:
    text: "查找聊天记录"
- assertVisible:
    text: "聊天背景"
- assertVisible:
    text: "清空聊天记录"
- takeScreenshot: chat_settings_read_only

# 会话内搜索入口
- tapOn:
    text: "查找聊天记录"
- waitForAnimationToEnd
- assertVisible:
    text: "查找聊天内容"
- assertVisible:
    text: "搜索消息提示"
- takeScreenshot: conversation_message_search
- back

# 聊天背景入口：只查看，不选择颜色或图片
- tapOn:
    text: "聊天背景"
- waitForAnimationToEnd
- assertVisible:
    text: "选择颜色"
- takeScreenshot: chat_background_settings
- back
- back
- back
