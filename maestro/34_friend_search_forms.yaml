appId: ${APP_ID}
name: "新好友与添加好友搜索表单"
tags:
  - smoke
  - read-only
onFlowStart:
  - runFlow: 01_login.yaml
---
- tapOn:
    id: "tab_contacts"
- extendedWaitUntil:
    visible:
      text: "新的朋友"
    timeout: 15000

# 新好友页：输入但不提交账号搜索
- tapOn:
    text: "新的朋友"
- waitForAnimationToEnd
- assertVisible:
    text: "账号/邮箱"
- tapOn:
    text: "账号/邮箱"
- inputText: "Maestro"
- hideKeyboard
- takeScreenshot: new_friend_search_form
- tapOn:
    text: "Maestro"
    index: 0
- eraseText: 30
- hideKeyboard
- back

# 添加好友页：只检查搜索框和发现入口
- tapOn:
    id: "add_friend_button"
- waitForAnimationToEnd
- assertVisible:
    text: "添加朋友"
- assertVisible:
    text: "附近的人"
- assertVisible:
    text: "面对面建群"
- assertVisible:
    text: "扫描二维码"
- assertVisible:
    text: "新注册的人"
- tapOn:
    text: "账号/邮箱"
- inputText: "Maestro"
- hideKeyboard
- takeScreenshot: add_friend_search_form
- tapOn:
    text: "Maestro"
    index: 0
- eraseText: 30
- hideKeyboard
- back

