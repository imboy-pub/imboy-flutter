appId: ${APP_ID}
name: "发朋友圈"
---
# 回到桌面（关闭任何华为弹窗），再点图标启动
- launchApp
- waitForAnimationToEnd

# 关闭 Maestro driver 安装成功对话框（Huawei 安全弹窗残留）
- runFlow:
    when:
      visible:
        id: "done_button"
    commands:
      - tapOn:
          id: "done_button"
      - waitForAnimationToEnd
- tapOn:
    id: "tab_contacts"
- waitForAnimationToEnd
- tapOn:
    text: "朋友圈"
- waitForAnimationToEnd
- takeScreenshot: moments_feed

# 点击右上角创建按钮（相机/撰写图标）
- tapOn:
    point: "95%, 8%"
- waitForAnimationToEnd
- assertVisible:
    text: "发送"
- tapOn:
    text: "这一刻的想法.*"
- inputText: "Maestro 自动化测试朋友圈 [请忽略]"
- tapOn:
    text: "确认"
- waitForAnimationToEnd
- takeScreenshot: moments_posted
