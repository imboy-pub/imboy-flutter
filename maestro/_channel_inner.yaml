appId: ${APP_ID}
name: "（内部）频道内容验证"
---
- tapOn:
    id: "tab_channel"
- waitForAnimationToEnd
- takeScreenshot: channel_list

# 订阅的频道（如果有）
- runFlow:
    when:
      visible:
        text: "订阅"
    commands:
      - takeScreenshot: channel_subscribed

# 发现频道
- runFlow:
    when:
      visible:
        text: "搜索频道"
    commands:
      - tapOn:
          text: "搜索频道"
      - waitForAnimationToEnd
      - assertVisible:
          text: "发现频道"
      - takeScreenshot: channel_discover
      - pressKey: Back

- tapOn:
    id: "tab_conversations"
