appId: ${APP_ID}
name: "E2EE 本地备份入口"
tags:
  - smoke
  - read-only
onFlowStart:
  - runFlow: 01_login.yaml
---
- tapOn:
    id: "tab_mine"
- scrollUntilVisible:
    element:
      text: "设置"
    direction: DOWN
- tapOn:
    text: "设置"
- scrollUntilVisible:
    element:
      text: "E2EE 密钥管理"
    direction: DOWN
- tapOn:
    text: "E2EE 密钥管理"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "密钥恢复方法"
    timeout: 20000

# 打开本地备份选项
- scrollUntilVisible:
    element:
      text: "本地备份"
    direction: DOWN
- tapOn:
    text: "本地备份"
- assertVisible:
    text: "导出备份"
- assertVisible:
    text: "导入备份"
- takeScreenshot: e2ee_local_backup_options

# 导出页只检查表单，不输入口令、不生成或上传备份
- tapOn:
    text: "导出备份"
- waitForAnimationToEnd
- assertVisible:
    text: "导出 E2EE 备份"
- assertVisible:
    text: "备份密码 \\*"
- assertVisible:
    text: "确认密码 \\*"
- scrollUntilVisible:
    element:
      text: "生成备份文件"
    direction: DOWN
- assertVisible:
    text: "密码强度"
- takeScreenshot: e2ee_backup_export_form
- back

# 导入页只检查表单，不选择文件、不恢复密钥
- scrollUntilVisible:
    element:
      text: "本地备份"
    direction: DOWN
- tapOn:
    text: "本地备份"
- tapOn:
    text: "导入备份"
- waitForAnimationToEnd
- assertVisible:
    text: "导入 E2EE 备份"
- assertVisible:
    text: "导入说明"
- assertVisible:
    text: "选择备份文件"
- assertVisible:
    text: "点击选择备份文件 \\(.enc\\)"
- takeScreenshot: e2ee_backup_import_form
- back
- back
- back

