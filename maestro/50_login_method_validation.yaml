appId: ${APP_ID}
name: "登录方式切换与空表单校验"
tags:
  - auth-preview
  - local-state-reset
onFlowStart:
  - clearState
  - launchApp
  - waitForAnimationToEnd
---
- runFlow:
    when:
      visible:
        text: "跳过"
    commands:
      - tapOn:
          text: "跳过"
      - waitForAnimationToEnd

- assertVisible:
    id: "login_phone_input"
- assertVisible:
    id: "login_password_input"
- assertVisible:
    text: "账号"
- assertVisible:
    text: "手机"
- assertVisible:
    text: "邮箱"

# 手机验证码登录：只检查字段和空提交提示，不请求验证码。
- tapOn:
    text: "手机"
- waitForAnimationToEnd
- assertVisible:
    text: "获取验证码"
- tapOn:
    text: "获取验证码"
- extendedWaitUntil:
    visible:
      text: "手机 是空的"
    timeout: 3000
- takeScreenshot: login_mobile_empty_validation

# 邮箱验证码登录：只检查邮箱字段和空提交提示。
- tapOn:
    text: "邮箱"
- waitForAnimationToEnd
- assertVisible:
    text: "请输入邮箱"
- tapOn:
    text: "获取验证码"
- extendedWaitUntil:
    visible:
      text: "邮箱 是空的"
    timeout: 3000
- takeScreenshot: login_email_empty_validation

# 账号密码登录：空提交只触发本地校验。
- tapOn:
    text: "账号"
- waitForAnimationToEnd
- tapOn:
    id: "login_submit_button"
- extendedWaitUntil:
    visible:
      text: "账号/密码 是空的"
    timeout: 3000
- takeScreenshot: login_account_empty_validation
