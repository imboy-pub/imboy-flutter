appId: ${APP_ID}
name: "退出登录"
onFlowStart:
  - runFlow: 01_login.yaml
---
- tapOn:
    id: "tab_mine"
- scroll

- runFlow:
    when:
      visible:
        text: "退出登录"
    commands:
      - tapOn:
          text: "退出登录"
      - runFlow:
          when:
            visible:
              text: "确认"
          commands:
            - tapOn:
                text: "确认"

      # 退出后回到欢迎页；跳过引导进入登录页
      - runFlow:
          when:
            visible:
              text: "跳过"
          commands:
            - tapOn:
                text: "跳过"
      - extendedWaitUntil:
          visible:
            id: "login_phone_input"
          timeout: 10000
      - takeScreenshot: after_logout
