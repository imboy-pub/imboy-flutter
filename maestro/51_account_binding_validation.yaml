appId: ${APP_ID}
name: "账号绑定表单本地校验"
tags:
  - smoke
  - read-only
  - local-validation
onFlowStart:
  - runFlow: 01_login.yaml
---
- tapOn:
    id: "tab_mine"
- scrollUntilVisible:
    element:
      text: "设置"
    direction: DOWN
- tapOn:
    text: "设置"
- waitForAnimationToEnd
- tapOn:
    text: "账号安全"
- waitForAnimationToEnd

# 邮箱绑定：输入非法格式，只验证本地状态，不请求验证码。
- tapOn:
    text: "绑定邮箱"
- waitForAnimationToEnd
- tapOn:
    text: "请输入邮箱地址"
- inputText: "invalid-email"
- hideKeyboard
- assertVisible:
    text: "格式检查"
- assertVisible:
    text: "待输入"
- assertVisible:
    text: "获取验证码"
- takeScreenshot: bind_email_invalid_validation
- back

# 手机绑定：输入过短号码，只验证本地状态，不请求验证码。
- tapOn:
    text: "绑定手机号"
- waitForAnimationToEnd
- tapOn:
    text: "请输入手机号"
- inputText: "123"
- hideKeyboard
- assertVisible:
    text: "格式检查"
- assertVisible:
    text: "待输入"
- assertVisible:
    text: "长度检查"
- assertVisible:
    text: "0 / 6"
- assertVisible:
    text: "获取验证码"
- takeScreenshot: bind_mobile_invalid_validation
- back
- back
