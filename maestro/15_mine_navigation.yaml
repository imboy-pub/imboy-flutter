appId: ${APP_ID}
name: "我的页核心入口"
tags:
  - smoke
  - read-only
onFlowStart:
  - runFlow: 01_login.yaml
---
- tapOn:
    id: "tab_mine"
- extendedWaitUntil:
    visible:
      text: "我的"
    timeout: 10000
- assertVisible:
    text: "ID: .*"
- takeScreenshot: mine_navigation

# 个人资料
- tapOn:
    text: "ID: .*"
- waitForAnimationToEnd
- assertVisible:
    text: "个人信息"
- assertVisible:
    text: "昵称"
- takeScreenshot: personal_info
- back

# 钱包由功能开关控制，仅在入口存在时检查
- runFlow:
    when:
      visible:
        text: "钱包"
    commands:
      - tapOn:
          text: "钱包"
      - waitForAnimationToEnd
      - assertVisible:
          text: "钱包"
      - takeScreenshot: wallet
      - back

# 收藏
- tapOn:
    text: "收藏"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "我的收藏"
    timeout: 10000
- takeScreenshot: favorites
- back

# 存储空间
- scrollUntilVisible:
    element:
      text: "存储空间"
    direction: DOWN
- tapOn:
    text: "存储空间"
- waitForAnimationToEnd
- assertVisible:
    text: "存储空间"
- takeScreenshot: storage_space
- back

# 登录设备（只查看，不下线或删除设备）
- scrollUntilVisible:
    element:
      text: "登录设备管理"
    direction: DOWN
- tapOn:
    text: "登录设备管理"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "登录设备管理"
    timeout: 15000
- takeScreenshot: login_devices
- back

# 反馈入口（只打开，不提交）
- scrollUntilVisible:
    element:
      text: "反馈建议"
    direction: DOWN
- tapOn:
    text: "反馈建议"
- waitForAnimationToEnd
- assertVisible:
    text: "反馈建议"
- takeScreenshot: feedback
- back

