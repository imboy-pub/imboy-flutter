appId: ${APP_ID}
name: "我的页面"
---
- launchApp
- tapOn:
    id: "tab_mine"
- takeScreenshot: mine_page

- runFlow:
    when:
      visible:
        text: "设置"
    commands:
      - tapOn:
          text: "设置"
      - waitForAnimationToEnd
      - takeScreenshot: settings_page

      # 关于入口位于设置页底部
      - scrollUntilVisible:
          element:
            text: "关于应用"
          direction: DOWN
      - tapOn:
          text: "关于应用"
      - waitForAnimationToEnd
      - takeScreenshot: about_page
      - back
      - back
