appId: ${APP_ID}
name: "新好友申请状态"
tags:
  - smoke
  - read-only
  - social-preview
onFlowStart:
  - runFlow: 01_login.yaml
---
- tapOn:
    id: "tab_contacts"
- extendedWaitUntil:
    visible:
      text: "新的朋友"
    timeout: 15000
- tapOn:
    text: "新的朋友"
- waitForAnimationToEnd
- assertVisible:
    text: "账号/邮箱"

# 兼容空列表、已处理、待验证和收到申请状态；不打开资料、不接受或删除
- extendedWaitUntil:
    visible:
      text: "(没有新的好友|已添加|等待验证|接受|已发送|已过期)"
    timeout: 15000
- takeScreenshot: new_friend_request_states_read_only
- back

