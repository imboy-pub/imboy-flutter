complaint: Жалоба
e2eeConsentTitle: Отправить зашифрованные доказательства
e2eeConsentBody: "Это сообщение зашифровано сквозным шифрованием; сервер не видит его содержимое. Отправка выдержки раскроет выбранный открытый текст модераторам для проверки. Согласны?"
e2eeConsentSubmit: Согласен и отправить
e2eeConsentDecline: Только жалоба (без содержимого)
