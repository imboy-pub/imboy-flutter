# CSM-01（§12.5.1 / §12.7）— 客服坐席工作台命名空间
# 入口 / 工作台 / 待接队列 / CAS 接单的移动端文案。
# 术语：坐席（seat）、待接（queued）、接单（claim）。
# ==================== 入口（权限驱动可见） ====================
entryTitle: "客服工作台"
entrySubtitle: "接单并处理排队中的客户会话"
# ==================== 工作台框架（三视图 Tab） ====================
title: "客服工作台"
tabQueued: "待接"
tabActive: "处理中"
tabClosed: "已关闭"
# 服务端未返回计数的徽标占位（不本地推断计数）
countUnavailable: "--"
# ==================== 坐席上下文 / 组织选择（seat-contexts 驱动） ====================
orgSelectorLabel: "组织"
