claimFailed: "接单失败，请稍后重试"
seatAtCapacity: "席位并发已满（处理中会话达上限），请先关闭处理中的会话或联系管理员调整容量"
# ==================== 处理中 / 已关闭（服务端 seats/sessions 真实列表） ====================
activeEmptyTitle: "暂无处理中会话"
activeEmptyHint: "从待接列表接单后，会话会显示在这里"
