ratedTitle: "客户已完成评分"
ratingScoreLabel: "客户评分：$score 星"
# ==================== 降级只读（可解释态） ====================
readOnlySuspended: "坐席已被暂停（suspend），消息通道已切换为只读，后台收发已停止"
