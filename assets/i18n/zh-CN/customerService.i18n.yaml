# 诚实展示（403 权限终态、seat_limit_exceeded 可解释文案）。
governance:
  title: "客服治理"
  scopeNote: "本页为组织治理面（owner/admin）；服务端 403 是最终权限裁决。"
  limitCardTitle: "席位额度"
  limitUnlimited: "不限"
  limitValueLabel: "${used}/${limit} 席位"
  limitAtCapacity: "已达上限"
  limitAdjustAction: "调整额度"
  limitAdjustTitle: "调整席位额度"
  limitInputLabel: "席位上限（正整数，留空 = 不限）"
  limitClearAction: "清除限制（不限）"
  limitInvalidInput: "请输入正整数"
  limitSaved: "额度已更新"
  seatsSectionTitle: "坐席席位"
  seatsEmpty: "暂无坐席席位"
  seatEnabledBadge: "启用"
  seatSuspendedBadge: "已停用"
  seatIdentityLabel: "坐席 ${identity}"
  seatCapacityLabel: "${active}/${max} 会话"
  seatLoadMore: "加载更多"
  suspendAction: "停用坐席"
  resumeAction: "启用坐席"
  suspendConfirmTitle: "停用该坐席？"
  suspendConfirmBody: "停用后不能再接新会话；进行中的会话不受影响，可随时再启用。"
  actionDone: "操作已生效"
  actionFailed: "操作失败，请稍后重试"
