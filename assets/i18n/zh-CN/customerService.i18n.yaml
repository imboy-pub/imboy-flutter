  errorLoadFailed: "加载失败"
  errorWithCode: "${msg}（${code}）"
  seatLimitExceededHint: "席位额度已满：已用 ${used}/${limit}，无法新增坐席（seat_limit_exceeded）"
  retry: "重试"
