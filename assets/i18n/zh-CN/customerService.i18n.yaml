tabQueued: "待接"
tabActive: "处理中"
tabClosed: "已关闭"
# 服务端未返回计数的徽标占位（不本地推断计数）
countUnavailable: "--"
# ==================== 待接列表（键集分页） ====================
waitingJustNow: "刚刚"
waitingMinutes: "$n 分钟"
waitingHoursMinutes: "$h 小时 $m 分"
waitingDaysHours: "$d 天 $h 小时"
sourceLabel: "来源"
