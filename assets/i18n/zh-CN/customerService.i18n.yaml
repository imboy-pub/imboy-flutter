sessionTitle: "客服会话"
channelUnavailable: "消息通道暂不可用，等待服务端补齐会话绑定"
visitorLabel: "客户"
seatLabel: "坐席"
inputHint: "输入回复内容…"
attachAction: "附件"
attachUploaded: "附件已上传"
attachPreviewTitle: "附件预览（企业安全通道）"
# ==================== CS-APP-01（附件投影渲染：文件行 / 图片缩略 / 预览占位） ====================
