noSeatHint: "你还没有启用中的客服坐席席位，请联系组织管理员开通"
# ==================== 待接列表（键集分页） ====================
waitingJustNow: "刚刚"
waitingMinutes: "$n 分钟"
waitingHoursMinutes: "$h 小时 $m 分"
