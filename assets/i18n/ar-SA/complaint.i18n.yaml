complaint: شكوى
e2eeConsentTitle: تقديم دليل مشفّر
e2eeConsentBody: هذه الرسالة مشفّرة من الطرف إلى الطرف ولا يمكن للخادم الاطلاع على محتواها. سيكشف تقديم مقتطف النص محتوى الرسالة المحدد للمشرفين لمراجعة البلاغ. هل توافق؟
e2eeConsentSubmit: أوافق وأرسل الدليل
e2eeConsentDecline: الإبلاغ فقط (بدون محتوى)
