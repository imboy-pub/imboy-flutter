loadFailedTitle: "Failed to load"
offlineHint: "Network unavailable, please check your connection and retry"
seatSuspendedNotice: "Seat suspended; the queue is read-only"
# ==================== CSM-02 Seat conversation page ====================
sessionTitle: "Support Conversation"
channelUnavailable: "Message channel unavailable — waiting for session binding"
visitorLabel: "Customer"
seatLabel: "Seat"
inputHint: "Type a reply…"
attachAction: "Attach"
attachUploaded: "Attachment uploaded"
attachPreviewTitle: "Attachment preview (enterprise secure channel)"
# ==================== CS-APP-01 (asset projection rendering: file row / image thumb / preview fallback) ====================
attachUnnamedFile: "Attachment"
attachStatusUnavailable: "Unavailable · $size"
attachUnsupportedType: "Unsupported file type. Please choose another"
attachBinaryNoPreview: "Binary content, preview unavailable"
# ==================== Transfer (CAS) ====================
transferAction: "Transfer"
transferTitle: "Transfer to a seat in this organization"
transferEmpty: "No eligible customer-service seats in this organization"
targetAvailable: "Available"
targetBusy: "Busy"
transferConfirmTitle: "Confirm transfer"
