# CSM-01 (§12.5.1 / §12.7) — Customer service seat workspace namespace
# Copy for entry visibility, workspace tabs, queued list, CAS claim.
# Terminology: seat, queued, claim.
# ==================== Entry (permission-driven visibility) ====================
entryTitle: "Support Workspace"
entrySubtitle: "Claim and handle queued customer conversations"
# ==================== Workspace frame (three view tabs) ====================
title: "Support Workspace"
tabQueued: "Queued"
tabActive: "Active"
tabClosed: "Closed"
# Badge placeholder when the server does not provide a count
countUnavailable: "--"
# ==================== Queued list (keyset pagination) ====================
waitingJustNow: "just now"
waitingMinutes: "$n min"
waitingHoursMinutes: "$h h $m min"
waitingDaysHours: "$d d $h h"
sourceLabel: "Source"
queuedEmptyTitle: "No queued conversations"
queuedEmptyHint: "Pull to refresh — new conversations will appear here"
loadingMore: "Loading more…"
loadMoreFailed: "Failed to load more, scroll up to retry"
noMore: "No more conversations"
# ==================== CAS claim ====================
claimAction: "Claim"
claimSuccess: "Claimed"
claimConflict: "This conversation was claimed by another seat or its state changed. The queue has been refreshed"
claimOffboardingRequired: "Offboarding handover in progress; claiming is unavailable"
claimForbidden: "Seat is suspended; claiming is unavailable"
claimFailed: "Claim failed, please try again later"
# ==================== Active / Closed (honest empty states for this card) ====================
activeEmptyTitle: "No active conversations"
activeEmptyHint: "Claim a conversation from the queue and it will appear here"
closedEmptyTitle: "No closed conversations"
closedEmptyHint: "Conversation history will arrive in a later release"
# ==================== States (error / offline) ====================
loadFailedTitle: "Failed to load"
offlineHint: "Network unavailable, please check your connection and retry"
seatSuspendedNotice: "Seat suspended; the queue is read-only"
