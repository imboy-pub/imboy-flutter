closeBody: "After closing, the customer will be asked to rate; the conversation becomes read-only."
closeReasonLabel: "Reason (optional)"
closeReasonTooLong: "Reason must be at most $max characters"
closeSuccess: "Conversation closed"
closeConflict: "Conversation state changed (closed or transferred elsewhere). Refreshed to the latest state"
closeFailed: "Close failed, please try again later"
# ==================== Rating wait (seat side shows status only) ====================
waitingRatingTitle: "Closed — waiting for the customer to rate"
ratedTitle: "The customer has rated this conversation"
ratingScoreLabel: "Customer rating: $score stars"
# ==================== Degraded read-only (explainable states) ====================
readOnlySuspended: "Seat suspended; the channel is read-only and background sync has stopped"
offboardingRequired: "Offboarding handover in progress; handling has been handed over and this conversation is read-only"
closedReadonly: "Conversation closed; content is view-only"
ratedReadonly: "Conversation rated and finished; content is view-only"
# ==================== APP-M02 (send/attach failure classes + transfer read-only) ====================
sendFailed: "Send failed. Please try again later"
sendConflict: "The session state has changed; the latest state has been refreshed for you"
attachUploadFailed: "Attachment upload failed. Please retry"
