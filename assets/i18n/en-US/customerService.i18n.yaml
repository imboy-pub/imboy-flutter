transferSuccess: "Transferred"
transferConflict: "Conversation state changed (transferred or closed elsewhere). Refreshed to the latest state"
transferFailed: "Transfer failed, please try again later"
# ==================== Close (CAS + optional reason) ====================
closeAction: "Close conversation"
