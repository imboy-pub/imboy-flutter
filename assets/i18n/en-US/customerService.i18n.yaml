# CSM-01 (§12.5.1 / §12.7) — Customer service seat workspace namespace
# Copy for entry visibility, workspace tabs, queued list, CAS claim.
# Terminology: seat, queued, claim.
# ==================== Entry (permission-driven visibility) ====================
entryTitle: "Support Workspace"
entrySubtitle: "Claim and handle queued customer conversations"
# ==================== Workspace frame (three view tabs) ====================
title: "Support Workspace"
tabQueued: "Queued"
tabActive: "Active"
tabClosed: "Closed"
# Badge placeholder when the server does not provide a count
