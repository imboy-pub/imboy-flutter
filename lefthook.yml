# Lefthook hooks for imboyapp (Flutter / Dart)
# Generated by quality-loop T1.1 on 2026-05-08
# See .claude/plans/quality-loop.md for context

pre-commit:
  parallel: true
  commands:
    dart-fmt:
      glob: "{lib,test,integration_test}/**/*.dart"
      exclude: "**/*.{g,freezed,gr,pb}.dart"
      run: dart format --set-exit-if-changed {staged_files}
      stage_fixed: false
    dart-analyze:
      glob: "lib/**/*.dart"
      exclude: "**/*.{g,freezed,gr,pb}.dart"
      run: dart analyze --no-fatal-warnings {staged_files}
    gitleaks:
      run: gitleaks protect --staged --no-banner --redact
    # C-20：改动 error_code.dart 时校验它确实是当前生成器 + 后端 hrl 的产物。
    # 该文件头写着"由脚本自动生成、请勿手动修改"，实测却被手工补过常量
    # （ERR_ERROR=1 当时不在 hrl 里）—— 于是没人再敢跑生成器，漂移了 7 个月。
    # 只在**并排存在 imboy 仓**时校验：独立 clone 下没有真源，跳过而不是误拦。
    # 远端门禁：.github/workflows/contract.yml（P3-C1，双仓 checkout + --check，
    # GitHub 每次 push/PR 跑）；本机钩子定位为提交前的快速反馈层。
    # pre-push 段另有一份兜底：覆盖"hrl 已改但本仓未重新生成"（本段 glob
    # 不命中的漂移场景）。
    error-code-sync:
      glob: "lib/config/error_code.dart"
      run: |
        hrl="${IMBOY_ERROR_CODE_HRL:-../imboy/include/error_code.hrl}"
        if [ ! -f "$hrl" ]; then
          echo "⚠️  未找到 $hrl，跳过错误码同步校验（独立 clone 属正常）" >&2
          exit 0
        fi
        dart run scripts/generate_error_code.dart --check --source="$hrl"
    design-tokens:
      glob: "lib/**/*.dart"
      exclude:
        - "lib/theme/**/*.dart"
        - "**/*.{g,freezed}.dart"
      run: |
        banned=$(git diff --cached --diff-filter=ACM -- {staged_files} \
          | grep '^+' | grep -v '^+++' \
          | grep -vE '^\+[[:space:]]*///' \
          | grep -E 'Color\(0x|fontSize:\s*[0-9]|\bColors\.[a-zA-Z]' \
          | grep -vE 'Colors\.transparent' || true)
        if [ -n "$banned" ]; then
          echo "❌ 禁止硬编码 Color/fontSize/Colors.*，请使用 AppColors/AppSpacing/FontSizeType Token:" >&2
          echo "$banned" >&2
          exit 1
        fi

commit-msg:
  commands:
    # 纯 shell 实现（imboyapp 是 Flutter 项目，避免引入 node 生态）
    # 校验 Conventional Commits：<type>(<scope>)!?: <subject>
    conventional:
      run: |
        if ! head -1 "{1}" | grep -qE '^(feat|fix|refactor|docs|test|chore|perf|ci|style|build|revert)(\([^)]+\))?!?: .{1,90}$'; then
          echo "❌ commit message 不符合 Conventional Commits 规范" >&2
          echo "   格式: <type>(<scope>)!?: <subject>" >&2
          echo "   type: feat|fix|refactor|docs|test|chore|perf|ci|style|build|revert" >&2
          exit 1
        fi

# pre-push 门控：合并到 main 前的最后一道防线
#   - dart-analyze-full: 总是跑，快（~10s），零依赖
#   - error-code-sync: 并排仓时跑 --check；覆盖"后端 hrl 已改、本仓生成物
#     未同步"的漂移（该场景不触碰 error_code.dart，pre-commit glob 不命中）
#   - api-contract-tests: 后端可达时跑 Tier 1 契约测试；不可达/未配置凭证时优雅跳过
# 紧急跳过：IMBOY_SKIP_PRE_PUSH=1 git push ...
pre-push:
  parallel: false
  commands:
    dart-analyze-full:
      tags: quality
      run: dart analyze lib --no-fatal-warnings
    error-code-sync:
      tags: quality
      run: |
        [ "${IMBOY_SKIP_PRE_PUSH:-0}" = "1" ] && exit 0
        hrl="${IMBOY_ERROR_CODE_HRL:-../imboy/include/error_code.hrl}"
        if [ ! -f "$hrl" ]; then
          echo "⚠️  未找到 $hrl，跳过错误码同步校验（独立 clone 属正常）" >&2
          exit 0
        fi
        dart run scripts/generate_error_code.dart --check --source="$hrl"
    api-contract-tests:
      tags: test
      run: bash scripts/pre_push_gate.sh
