# Locally patched for standalone Flutter UI packages; see UPSTREAM.json.
name: wechat_assets_picker
publish_to: none
version: 10.1.3
description: |
  An image picker (also with videos and audio)
  for Flutter projects based on WeChat's UI,
  with full support for customization.
topics:
  - picker
  - image
  - audio
  - video
  - wechat

repository: https://github.com/fluttercandies/flutter_wechat_assets_picker
issue_tracker: https://github.com/fluttercandies/flutter_wechat_assets_picker/issues

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6
  flutter:
    sdk: flutter

  wechat_picker_library: ^1.0.7

  extended_image: '>=8.3.0 <11.0.0'
  meta: ^1.12.0
  photo_manager: ^3.5.0
  photo_manager_image_provider: ^2.2.0
  provider: ^6.0.5
  video_player: ^2.7.0
  visibility_detector: ^0.4.0

dev_dependencies:
  flutter_lints: any
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - 'assets/icon/'
