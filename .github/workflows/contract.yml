# imboyapp 契约门 — Golden Gates 计划 P3-C1（2026-08-22）
#
# 断言：lib/config/error_code.dart（生成物，入仓）与后端真源
#       imboy/include/error_code.hrl 逐字一致 —— 漂移当场拦截。
#
# 真源在后端仓（imboy-pub/imboy），生成物在本仓：双 checkout 是标准做法
# （第二个 checkout 读取 .github/ci-source-lock.json 的仓库及完整 SHA）。
# 普通 CI、质量门与 UIUX 离线使用同一版本锁，不浮动读取后端 main。
#
# 不加 paths 过滤：漂移不只来自"有人手改 error_code.dart"（那会被 paths
# 命中），更来自"后端 hrl 已改、本仓生成物未同步"（本仓可能零文件变更，
# paths 过滤会漏检）。由主 CI 每次 push/PR 调用并断言，本 job 全程 <1min。
#
# 后续（计划 §2.3 C2）admin 枚举/EntityId 契约 job 预留并入本 workflow。

name: imboyapp Contract Gate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  error-code-contract:
    name: Error code contract (hrl ↔ generated dart)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: imboyapp
    steps:
      - name: Checkout imboyapp（生成物所在仓）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: imboyapp

      - name: Resolve pinned cross-repository sources
        id: sources
        run: python3 .github/scripts/ci_source_lock.py outputs --app . --github-output "$GITHUB_OUTPUT"

      - name: Checkout imboy backend（错误码真源仓）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.sources.outputs.backend_repository }}
          ref: ${{ steps.sources.outputs.backend_sha }}
          path: imboy
          fetch-depth: 1

      - name: Verify actual source checkouts
        run: python3 .github/scripts/ci_source_lock.py checkout --app . --backend ../imboy --output "$RUNNER_TEMP/error-code-source-checkout.json"

      - name: Setup Dart
        # 生成器纯 dart:io 标准库（无 package: 依赖、无需 pub get、
        # 无需 Flutter SDK），使用满足项目 SDK 下限的 Dart 3.13.4
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
        with:
          sdk: '3.13.4'

      - name: Verify SDK compatibility
        run: python3 scripts/check_sdk_compatibility.py --dart-only

      - name: Verify generated error_code.dart matches error_code.hrl
        # 退出码 0 = 生成物与真源一致；1 = 漂移（红门禁，无 continue-on-error）
        run: dart scripts/generate_error_code.dart --check --source=../imboy/include/error_code.hrl

      - name: Retain source identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: error-code-source-checkout
          path: ${{ runner.temp }}/error-code-source-checkout.json
          if-no-files-found: warn

  # ----------------------------------------------------------------
  # CI-01：proto regen 漂移门（imboy.proto ↔ imboyapp 生成物）
  # imboy/src/imboy.proto 变更后必须在 imboyapp 跑 scripts/regen_protobuf.sh
  # 并同一 PR 提交生成物；漏 regen 即红。无 continue-on-error。
  # ----------------------------------------------------------------
  proto-regen-contract:
    name: Proto regen drift (imboy.proto ↔ lib/service/protocol)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: imboyapp
    steps:
      - name: Checkout imboyapp（生成物所在仓）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: imboyapp

      - name: Resolve pinned cross-repository sources
        id: sources
        run: python3 .github/scripts/ci_source_lock.py outputs --app . --github-output "$GITHUB_OUTPUT"

      - name: Checkout imboy backend（proto 真源仓）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.sources.outputs.backend_repository }}
          ref: ${{ steps.sources.outputs.backend_sha }}
          # path=imboy：满足 regen_protobuf.sh 的并排布局假设
          # （APP_DIR/../imboy/src/imboy.proto）
          path: imboy
          fetch-depth: 1

      - name: Verify actual source checkouts
        run: python3 .github/scripts/ci_source_lock.py checkout --app . --backend ../imboy --output "$RUNNER_TEMP/proto-source-checkout.json"

      - name: Install protoc
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
          protoc --version

      - name: Setup Dart + protoc_plugin
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
        with:
          sdk: '3.13.4'
      - name: Verify SDK compatibility
        run: python3 scripts/check_sdk_compatibility.py --dart-only

      - run: dart pub global activate protoc_plugin 25.1.0

      - name: Regen and verify no drift
        run: |
          bash scripts/regen_protobuf.sh --check

      - name: Retain source identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: proto-source-checkout
          path: ${{ runner.temp }}/proto-source-checkout.json
          if-no-files-found: warn
