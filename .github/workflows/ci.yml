name: ImBoy CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:
  schedule:
    # 每日 UTC 18:00 跑全量路由烟雾测试（进程隔离，较慢，不放 PR 快速门）
    - cron: '0 18 * * *'

env:
  FLUTTER_VERSION: '3.41.0'

jobs:
  # ==================== 测试任务 ====================
  unit-widget-test:
    name: Run Unit/Widget Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate CI test paths
        run: .github/scripts/validate_ci_test_paths.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        # 此前是 `flutter format`，该子命令在 Flutter 3.19 已移除，而 CI 固定 3.41.0
        # → 本 step 必挂 → 同 job 后续 analyze / 边界检查 / 单元测试 / moment 回归门
        #   全部从未执行过。命令修正后，格式问题才第一次暴露出来：148 个文件未格式化。
        #
        # 检查范围改为 `git ls-files '*.dart'` 而非目录扫描 `.`：
        # 后者会扫进 plugin/amap_flutter_location_plus（submodule，mode 160000）
        # 与 build/ 等 gitignored 生成物 —— 前者的文件属于**另一个仓库**，
        # 本仓永远改不了，硬门禁因此在结构上不可能变绿。
        # 用 git ls-files 天然排除 submodule、gitignored 与 vendored 插件，
        # 检查范围正好是本仓自己受版本控制的 .dart 文件。
        #
        # C-01b 已完成：1359 个受版本控制的 .dart 全部合规，本地实测退出码 0，
        # 故摘掉此前的 `|| true`，恢复为硬门禁。
        run: |
          set -o pipefail
          git ls-files -z '*.dart' | xargs -0 dart format --output=none --set-exit-if-changed

      - name: Analyze code
        # errors 仍然阻断；warnings/infos 的 ratchet 计数由 quality.yml 负责，
        # 此处不再用默认的 fatal-warnings（与 830 基线矛盾会导致永久红）
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Check module boundaries
        run: dart scripts/check_boundaries.dart
        continue-on-error: true   # 基线期，收集数据；归零后删此行

      - name: New code guard (changed dart files)
        run: .github/scripts/lint_changed_dart.sh

      - name: Run unit/widget tests
        run: |
          # 排除 test/integration/（独立 job）与 test/smoke/（共享 isolate 会级联，
          # 由专用隔离 runner job route-smoke-test 运行）。
          TEST_FILES="$(find test -type f -name '*_test.dart' ! -path 'test/integration/*' ! -path 'test/smoke/*' | tr '\n' ' ')"
          if [ -z "$TEST_FILES" ]; then
            echo "No unit/widget test files found outside test/integration/ and test/smoke/"
            exit 0
          fi
          flutter test $TEST_FILES --reporter=github

      - name: Moment regression gate
        run: |
          flutter test test/service/message_type_constants_test.dart --reporter=github
          flutter test test/service/message_s2c_test.dart --reporter=github
          flutter test test/service/moment_event_test.dart --reporter=github
          flutter test test/page/moment/moment_routes_test.dart --reporter=github

  # ----------------------------------------------------------------
  # E2EE Suite — 加密套件门（阻塞）
  # 基线 2026-08-02：588 例全绿 + dart analyze lib 零 issue。
  # 依赖 vodozemac FFI 的用例在无 spike dylib 时自动 skip（spikes/ 未跟踪入仓，
  # CI 重建 dylib 为后续任务，见 summary 输出）。
  # ----------------------------------------------------------------
  e2ee:
    name: E2EE Suite Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze lib (zero-issue gate)
        run: dart analyze lib

      - name: Run E2EE suite
        run: |
          set -o pipefail
          flutter test test/service/e2ee/ --reporter=github 2>&1 | tee e2ee-suite.log

      - name: Summarize E2EE suite
        if: always()
        run: |
          echo "## E2EE suite" >> "$GITHUB_STEP_SUMMARY"
          tail -3 e2ee-suite.log >> "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "注：依赖 vodozemac FFI 的用例在无 spike dylib 时自动 skip；dylib 未跟踪入仓（spikes/），CI 重建为后续任务。" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run integration tests
        run: flutter test test/integration/ --reporter=github

      - name: Channel regression gate (test/integration)
        run: flutter test test/integration/channel_integration_test.dart --reporter=github

      - name: Run integration_test suite
        run: |
          TEST_FILES="$(find integration_test -type f -name '*_test.dart' | tr '\n' ' ')"
          if [ -z "$TEST_FILES" ]; then
            echo "No test files found under integration_test/"
            exit 0
          fi
          flutter test integration_test/ --reporter=github

      - name: Generate coverage report
        run: |
          flutter test test/integration/ --coverage
          mv coverage/lcov.info coverage/lcov.test_integration.info

          TEST_FILES="$(find integration_test -type f -name '*_test.dart' | tr '\n' ' ')"
          if [ -z "$TEST_FILES" ]; then
            echo "No test files found under integration_test/, skip integration_test coverage"
            cp coverage/lcov.test_integration.info coverage/lcov.integration_test.info
          else
            flutter test integration_test/ --coverage
            mv coverage/lcov.info coverage/lcov.integration_test.info
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.test_integration.info,coverage/lcov.integration_test.info
          flags: integration-tests
          name: integration-test-coverage

  # ==================== 构建任务 ====================
  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: [unit-widget-test, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Inject Firebase google-services.json
        if: ${{ secrets.GOOGLE_SERVICES_JSON_B64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json

      - name: Build APK (Release)
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          flutter build apk --release \
            --dart-define=SENTRY_DSN="${SENTRY_DSN:-}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # ==================== iOS构建任务 ====================
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: [unit-widget-test, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Inject Firebase GoogleService-Info.plist
        if: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 != '' }}
        env:
          GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          echo "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 -d > ios/Runner/GoogleService-Info.plist

      - name: Build iOS (Release)
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SENTRY_DSN="${SENTRY_DSN:-}"

  # ==================== 静态分析任务 ====================
  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Check code coverage
        run: |
          flutter test --coverage
          test -f coverage/lcov.info

  # ==================== 性能测试任务 ====================
  performance-test:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run performance tests
        run: |
          flutter test test/integration/conversation_state_mock_test.dart --reporter=github
          flutter test test/integration/message_action_conversation_update_mock_test.dart --name="性能" --reporter=github

  # ----------------------------------------------------------------
  # DCO — 仅 PR 检查，验证所有 commits 带有 Signed-off-by
  # ----------------------------------------------------------------
  dco-check:
    name: DCO check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: DCO check
        uses: dco-org/dco-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------------
  # 全页面路由烟雾测试（进程隔离）——仅 nightly schedule + 手动触发。
  # 每条路由独立进程运行，规避共享 isolate 级联；较慢，不放 PR 快速门。
  # ----------------------------------------------------------------
  route-smoke-test:
    name: Route Smoke Test (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run isolated route smoke test
        run: bash test/smoke/run_smoke_isolated.sh --quiet
