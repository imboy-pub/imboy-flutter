name: ImBoy CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  execution-plan:
    name: Test ownership and PR plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate all tracked test ownership
        run: bash .github/scripts/validate_ci_test_paths.sh
      - name: Freeze expected instances
        run: python3 scripts/auto_test.py execution-plan --profile pr --output "${{ runner.temp }}/pr-plan.json"
      - name: Derive host workers from the frozen plan
        id: matrix
        run: |
          python3 scripts/auto_test.py execution-matrix \
            --plan "${{ runner.temp }}/pr-plan.json" \
            --output "${{ runner.temp }}/host-matrix.json"
          python3 - "${{ runner.temp }}/host-matrix.json" <<'PY'
          import json
          import os
          import sys
          with open(sys.argv[1], encoding='utf-8') as source:
              matrix = json.load(source)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('matrix=' + json.dumps(matrix, separators=(',', ':')) + '\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: execution-plan
          path: |
            ${{ runner.temp }}/pr-plan.json
            ${{ runner.temp }}/host-matrix.json
          if-no-files-found: error

  host-tests:
    name: PR tests (${{ matrix.platform }}, ${{ matrix.suite }})
    needs: execution-plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.execution-plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: imboyapp
    steps:
      - uses: actions/checkout@v7
        with:
          path: imboyapp
          submodules: recursive
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/imboy
          path: imboy
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/imboy-admin-frontend
          path: imboyadmin
      - uses: actions/download-artifact@v7
        with:
          name: execution-plan
          path: ${{ runner.temp }}/execution-plan
      - name: Setup Flutter
        id: sdk
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify SDK compatibility
        run: python3 scripts/check_sdk_compatibility.py
      - name: Prepare isolated host dependencies
        id: dependencies
        run: |
          bash .github/scripts/ci_patch_path_deps.sh --check
          flutter pub get --enforce-lockfile
          bash .github/scripts/ci_gen_env.sh
          bash .github/scripts/ci_build_vod.sh
      - name: Run declared PR instances and collect coverage in the same run
        if: always()
        env:
          SDK_OUTCOME: ${{ steps.sdk.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          WORKER_PLATFORM: ${{ matrix.platform }}
          WORKER_SUITE: ${{ matrix.suite }}
          COVERAGE_OPTION: ${{ matrix.coverage }}
        run: |
          python3 scripts/auto_test.py execution-run \
            --plan "${{ runner.temp }}/execution-plan/pr-plan.json" \
            --worker-platform "$WORKER_PLATFORM" --worker-suite "$WORKER_SUITE" $COVERAGE_OPTION \
            --upstream "sdk=$SDK_OUTCOME" --upstream "dependencies=$DEPENDENCIES_OUTCOME" \
            --artifact-dir "${{ runner.temp }}/execution-${{ matrix.platform }}-${{ matrix.suite }}"
      - name: Upload execution evidence even after failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: execution-${{ matrix.platform }}-${{ matrix.suite }}
          path: ${{ runner.temp }}/execution-${{ matrix.platform }}-${{ matrix.suite }}/
          if-no-files-found: warn

  coverage:
    name: PR coverage (all Linux suites)
    if: always()
    needs: [execution-plan, host-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download frozen PR plan
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: execution-plan
          path: ${{ runner.temp }}/execution-plan
      - name: Collect every Linux worker artifact
        if: always()
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: execution-linux-*
          path: ${{ runner.temp }}/linux-results
          merge-multiple: false
      - name: Reconcile declared coverage evidence and check the combined threshold
        if: always()
        run: |
          python3 scripts/auto_test.py execution-coverage \
            --plan "${{ runner.temp }}/execution-plan/pr-plan.json" \
            --results "${{ runner.temp }}/linux-results" --platform linux \
            --output "${{ runner.temp }}/execution-coverage/lcov.info" --minimum 38
      - name: Retain combined coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: execution-coverage
          path: ${{ runner.temp }}/execution-coverage/
          if-no-files-found: warn

  quality-gates:
    uses: ./.github/workflows/quality.yml
    with:
      tests_owned_by_ci: true

  contract-gates:
    uses: ./.github/workflows/contract.yml

  test-summary:
    name: IMBoy Test Summary
    if: always()
    needs: [execution-plan, host-tests, coverage, quality-gates, contract-gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reconstruct expected plan from the checked-out commit
        run: python3 scripts/auto_test.py execution-plan --profile pr --output "${{ runner.temp }}/pr-plan.json"
      - name: Collect results
        if: always()
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: execution-*
          path: ${{ runner.temp }}/execution-results
      - name: Reconcile every required instance and upstream job
        if: always()
        env:
          UPSTREAM_JOBS: ${{ toJSON(needs) }}
        run: |
          python3 scripts/auto_test.py execution-summary \
            --plan "${{ runner.temp }}/pr-plan.json" \
            --results "${{ runner.temp }}/execution-results" \
            --upstream-env UPSTREAM_JOBS \
            --output "${{ runner.temp }}/execution-summary.json"
      - name: Retain final reconciliation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: execution-summary
          path: ${{ runner.temp }}/execution-summary.json
          if-no-files-found: warn

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: [test-summary]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      # secrets 上下文不允许出现在 step if 中（会致整个 workflow 验证失败 0s 红），
      # 必须在 job 级 env 映射后用 env 上下文判断
      GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup JDK 17 (ubuntu-latest 默认 Java 25 与 Gradle 8.14 不兼容，Gradle 9.1+ 才支持；AGP 8.11 官方支持 JDK 17)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Verify SDK compatibility
        run: python3 scripts/check_sdk_compatibility.py

      - name: Get dependencies
        run: |
          bash .github/scripts/ci_patch_path_deps.sh --check
          flutter pub get --enforce-lockfile
          bash .github/scripts/ci_gen_env.sh
          bash .github/scripts/ci_build_vod.sh

      - name: Inject Firebase google-services.json
        if: ${{ env.GOOGLE_SERVICES_JSON_B64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json

      - name: Strip local dev proxy (gradle.properties 内含本机代理 127.0.0.1:7897，CI 无此代理)
        run: sed -i.bak '/systemProp.http.proxy/d;/systemProp.https.proxy/d' android/gradle.properties && rm -f android/gradle.properties.bak

      - name: Prepare release signing fallback (CI 无正式签名材料，用 debug keystore 出可安装产物)
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          {
            echo "storeFile=$HOME/.android/debug.keystore"
            echo "keyAlias=androiddebugkey"
            echo "keyPassword=android"
            echo "storePassword=android"
          } > android/key.properties

      - name: Build APK (Release)
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          flutter build apk --release \
            --flavor standard \
            --dart-define=SENTRY_DSN="${SENTRY_DSN:-}"

      - name: Build standard AAB (debug-signed CI smoke only)
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          flutter build appbundle --release --flavor standard \
            --dart-define=SENTRY_DSN="${SENTRY_DSN:-}"
          test -f build/app/outputs/bundle/standardRelease/app-standard-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-standard-release.apk

  # ==================== iOS构建任务 ====================
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: [test-summary]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Verify SDK compatibility
        run: python3 scripts/check_sdk_compatibility.py

      - name: Get dependencies
        run: |
          bash .github/scripts/ci_patch_path_deps.sh --check
          flutter pub get --enforce-lockfile
          bash .github/scripts/ci_gen_env.sh
          bash .github/scripts/ci_build_vod.sh

      - name: Inject Firebase GoogleService-Info.plist
        if: ${{ env.GOOGLE_SERVICE_INFO_PLIST_B64 != '' }}
        env:
          GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          echo "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 -d > ios/Runner/GoogleService-Info.plist

      - name: Update CocoaPods specs repo (Agora 等依赖要求最新 specs)
        run: pod repo update

      - name: Build iOS (Release)
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SENTRY_DSN="${SENTRY_DSN:-}"

  dco-check:
    name: DCO check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: DCO check（shell 实现；dco-org/dco-action 仓库已下线）
        run: |
          # 验证 PR 实际提交，不含 GitHub 自动生成且无签署的测试合并提交（HEAD）。
          range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          rc=0
          while read -r sha email; do
            # 两段式 + -F 固定串：单条正则会对 email 中的 [ ] + . 等元字符
            # 误判（dependabot[bot] 必误报缺签名）
            if ! git log -1 --format='%b' "$sha" | grep -i "^signed-off-by:" | grep -qiF "<${email}>"; then
              echo "::error::commit ${sha:0:12}: 作者 <${email}> 缺少匹配的 Signed-off-by（git commit --amend -s 补签）"
              rc=1
            fi
          done < <(git log --format='%H %ae' "$range")
          exit $rc

  route-smoke-test:
    name: Route Smoke Test (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: imboyapp
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          path: imboyapp
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/imboy
          path: imboy
      - name: Freeze isolated route plan
        run: python3 scripts/auto_test.py execution-plan --profile routes --platform linux --output "${{ runner.temp }}/routes-plan.json"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Prepare host
        run: |
          python3 scripts/check_sdk_compatibility.py
          bash .github/scripts/ci_patch_path_deps.sh --check
          flutter pub get --enforce-lockfile
          bash .github/scripts/ci_gen_env.sh
          bash .github/scripts/ci_build_vod.sh
      - name: Run each route in its own process
        run: python3 scripts/auto_test.py execution-run --plan "${{ runner.temp }}/routes-plan.json" --artifact-dir "${{ runner.temp }}/routes"
      - name: Reconcile routes
        if: always()
        run: python3 scripts/auto_test.py execution-summary --plan "${{ runner.temp }}/routes-plan.json" --results "${{ runner.temp }}/routes" --output "${{ runner.temp }}/routes-summary.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: route-smoke-evidence
          path: |
            ${{ runner.temp }}/routes/
            ${{ runner.temp }}/routes-summary.json
