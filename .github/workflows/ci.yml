name: ImBoy CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.5'
  # Ubuntu is pinned below and in the host matrix; upgrade only after the
  # existing gates and native builds have passed on the candidate image.

jobs:
  execution-plan:
    name: Test ownership and PR plan
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate all tracked test ownership
        run: bash .github/scripts/validate_ci_test_paths.sh
      - name: Freeze expected instances
        run: python3 scripts/auto_test.py execution-plan --profile pr --output "${{ runner.temp }}/pr-plan.json"
      - name: Derive host workers from the frozen plan
        id: matrix
        run: |
          python3 scripts/auto_test.py execution-matrix \
            --plan "${{ runner.temp }}/pr-plan.json" \
            --output "${{ runner.temp }}/host-matrix.json"
          python3 - "${{ runner.temp }}/host-matrix.json" <<'PY'
          import json
          import os
          import sys
          with open(sys.argv[1], encoding='utf-8') as source:
              matrix = json.load(source)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('matrix=' + json.dumps(matrix, separators=(',', ':')) + '\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: execution-plan
          path: |
            ${{ runner.temp }}/pr-plan.json
            ${{ runner.temp }}/host-matrix.json
          if-no-files-found: error

  host-tests:
    name: PR tests (${{ matrix.platform }}, ${{ matrix.suite }})
    needs: execution-plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.execution-plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: imboyapp
    steps:
      - uses: actions/checkout@v7
        with:
          path: imboyapp
          submodules: false
          fetch-depth: 0
      - name: Checkout pinned submodules (bounded retry)
        timeout-minutes: 10
        run: bash .github/scripts/ci_checkout_submodules.sh 0
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/imboy
          path: imboy
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/imboy-admin-frontend
          path: imboyadmin
      - uses: actions/download-artifact@v8
        with:
          name: execution-plan
          path: ${{ runner.temp }}/execution-plan
      - name: Install declared Linux SQLite dependency
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsqlite3-dev
      - name: Setup Flutter
        id: sdk
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify SDK compatibility
        run: python3 scripts/check_sdk_compatibility.py
      - name: Prepare isolated host dependencies
        id: dependencies
        env:
          WORKER_PLATFORM: ${{ matrix.platform }}
          WORKER_EVIDENCE_DIR: ${{ runner.temp }}/execution-${{ matrix.platform }}-${{ matrix.suite }}
        run: |
          set -euo pipefail
          bash .github/scripts/ci_patch_path_deps.sh --check
          flutter pub get --enforce-lockfile
          bash .github/scripts/ci_gen_env.sh
          if [ "$WORKER_PLATFORM" = web ]; then
            mkdir -p "$WORKER_EVIDENCE_DIR"
            bash .github/scripts/ci_prepare_chrome.sh 2>&1 | tee "$WORKER_EVIDENCE_DIR/chrome-preflight.log"
            # cs_asset_put_transport_web_test 的 19972 直传 fixture（随仓
            # 提交但此前漏接线：不启动服务且未设 dart-define，测试恒 skip
            # → 编排器判 UNEXPECTED_SKIP 阻断 web unit）。
            node test/customer_service/fixtures/cs_direct_web_server.cjs \
              > "$WORKER_EVIDENCE_DIR/cs-direct-fixture.log" 2>&1 &
            echo "cs fixture pid=$!" | tee -a "$WORKER_EVIDENCE_DIR/cs-direct-fixture.log"
          else
            bash .github/scripts/ci_build_vod.sh
          fi
      - name: Run declared PR instances and collect coverage in the same run
        if: always()
        env:
          SDK_OUTCOME: ${{ steps.sdk.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          WORKER_PLATFORM: ${{ matrix.platform }}
          WORKER_SUITE: ${{ matrix.suite }}
          COVERAGE_OPTION: ${{ matrix.coverage }}
        run: |
          python3 scripts/auto_test.py execution-run \
            --plan "${{ runner.temp }}/execution-plan/pr-plan.json" \
            --worker-platform "$WORKER_PLATFORM" --worker-suite "$WORKER_SUITE" $COVERAGE_OPTION \
            --upstream "sdk=$SDK_OUTCOME" --upstream "dependencies=$DEPENDENCIES_OUTCOME" \
            --artifact-dir "${{ runner.temp }}/execution-${{ matrix.platform }}-${{ matrix.suite }}"
      - name: Upload execution evidence even after failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: execution-${{ matrix.platform }}-${{ matrix.suite }}
          path: ${{ runner.temp }}/execution-${{ matrix.platform }}-${{ matrix.suite }}/
          if-no-files-found: warn

  debian-core:
    name: Debian 13 core compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The Ubuntu host supplies Docker/the kernel; all run steps and native
    # builds below execute in Debian userspace, without a Debian systemd boot.
    container:
      image: debian:trixie-20261104-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      # Install Git before checkout: the execution catalog requires git
      # ls-files / commit binding, so checkout's archive fallback is unsuitable.
      - name: Prepare Debian userspace
        id: system
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = debian
          test "$VERSION_ID" = 13
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git jq xz-utils unzip zip tar zstd \
            python3 build-essential pkg-config libglu1-mesa libsqlite3-dev
          mkdir -p "$RUNNER_TEMP/debian-core"
          {
            cat /etc/os-release
            uname -a
            ldd --version
            python3 --version
            dpkg-query -W libc6 libstdc++6 libsqlite3-0 libsqlite3-dev
          } | tee "$RUNNER_TEMP/debian-core/environment.log"
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Checkout pinned submodules (bounded retry)
        timeout-minutes: 10
        run: bash .github/scripts/ci_checkout_submodules.sh
      - name: Freeze the small Linux compatibility plan
        run: python3 scripts/auto_test.py execution-plan --profile linux-compat --output "${{ runner.temp }}/debian-core/plan.json"
      - name: Setup Flutter with Debian-only caches
        id: sdk
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: 'flutter-debian13-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter-debian13/:version:/:arch:'
          pub-cache-key: 'pub-debian13-:os:-:channel:-:version:-:arch:-:hash:'
          pub-cache-path: ${{ runner.temp }}/pub-cache-debian13
      - name: Prepare SDK, locked Dart packages and native FFI
        id: dependencies
        run: |
          set -euo pipefail
          # Official archives may retain a non-root owner in job containers.
          git config --global --add safe.directory "$FLUTTER_ROOT"
          python3 scripts/check_sdk_compatibility.py
          bash .github/scripts/ci_patch_path_deps.sh --check
          flutter pub get --enforce-lockfile
          bash .github/scripts/ci_gen_env.sh
          curl --proto '=https' --tlsv1.2 -fsS https://sh.rustup.rs \
            -o "$RUNNER_TEMP/rustup-init.sh"
          sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain "$RUSTUP_TOOLCHAIN"
          . "$HOME/.cargo/env"
          {
            flutter --version
            dart --version
            rustc --version
            cargo --version
          } 2>&1 | tee -a "$RUNNER_TEMP/debian-core/environment.log"
          bash .github/scripts/ci_build_vod.sh
      - name: Execute declared core instances in Debian
        if: always()
        env:
          SYSTEM_OUTCOME: ${{ steps.system.outcome }}
          SDK_OUTCOME: ${{ steps.sdk.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
        run: |
          python3 scripts/auto_test.py execution-run \
            --plan "${{ runner.temp }}/debian-core/plan.json" \
            --upstream "system=$SYSTEM_OUTCOME" --upstream "sdk=$SDK_OUTCOME" \
            --upstream "dependencies=$DEPENDENCIES_OUTCOME" \
            --artifact-dir "${{ runner.temp }}/debian-core/results"
      - name: Reconcile Debian evidence
        if: always()
        run: |
          python3 scripts/auto_test.py execution-summary \
            --plan "${{ runner.temp }}/debian-core/plan.json" \
            --results "${{ runner.temp }}/debian-core/results" \
            --output "${{ runner.temp }}/debian-core/summary.json"
      - name: Retain Debian evidence separately from PR coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debian-core-evidence
          path: ${{ runner.temp }}/debian-core/
          if-no-files-found: error

  coverage:
    name: PR coverage (all Linux suites)
    if: always()
    needs: [execution-plan, host-tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Download frozen PR plan
        uses: actions/download-artifact@v8
        with:
          name: execution-plan
          path: ${{ runner.temp }}/execution-plan
      - name: Collect every Linux worker artifact
        if: always()
        uses: actions/download-artifact@v8
        with:
          pattern: execution-linux-*
          path: ${{ runner.temp }}/linux-results
          merge-multiple: false
      - name: Reconcile declared coverage evidence and check the combined threshold
        if: always()
        run: |
          python3 scripts/auto_test.py execution-coverage \
            --plan "${{ runner.temp }}/execution-plan/pr-plan.json" \
            --results "${{ runner.temp }}/linux-results" --platform linux \
            --output "${{ runner.temp }}/execution-coverage/lcov.info" --minimum 38
      - name: Retain combined coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: execution-coverage
          path: ${{ runner.temp }}/execution-coverage/
          if-no-files-found: warn

  quality-gates:
    uses: ./.github/workflows/quality.yml
    with:
      tests_owned_by_ci: true

  contract-gates:
    uses: ./.github/workflows/contract.yml

  test-summary:
    name: IMBoy Test Summary
    if: always()
    needs: [execution-plan, host-tests, debian-core, coverage, quality-gates, contract-gates, route-smoke-test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Reconstruct expected plan from the checked-out commit
        run: python3 scripts/auto_test.py execution-plan --profile pr --output "${{ runner.temp }}/pr-plan.json"
      - name: Collect results
        if: always()
        uses: actions/download-artifact@v8
        with:
          pattern: execution-*
          path: ${{ runner.temp }}/execution-results
      - name: Reconcile every required instance and upstream job
        if: always()
        env:
          UPSTREAM_JOBS: ${{ toJSON(needs) }}
        run: |
          python3 scripts/auto_test.py execution-summary \
            --plan "${{ runner.temp }}/pr-plan.json" \
            --results "${{ runner.temp }}/execution-results" \
            --upstream-env UPSTREAM_JOBS \
            --output "${{ runner.temp }}/execution-summary.json"
      - name: Retain final reconciliation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: execution-summary
          path: ${{ runner.temp }}/execution-summary.json
          if-no-files-found: warn

  build:
    name: Build APK
    runs-on: ubuntu-24.04
    needs: [test-summary]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    env:
      # GitHub-hosted runners use official Google Maven / Maven Central.
      ORG_GRADLE_PROJECT_imboyUseMavenMirror: 'false'
      # secrets 上下文不允许出现在 step if 中（会致整个 workflow 验证失败 0s 红），
      # 必须在 job 级 env 映射后用 env 上下文判断
      GOOGLE_SERVICES_JSON_B64: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.GOOGLE_SERVICES_JSON_B64 || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Checkout pinned submodules (bounded retry)
        timeout-minutes: 10
        run: bash .github/scripts/ci_checkout_submodules.sh

      - name: Setup JDK 17 (explicit AGP 8.11 / Gradle 8.14 toolchain)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Verify SDK compatibility
        run: python3 scripts/check_sdk_compatibility.py

      - name: Get dependencies
        run: |
          bash .github/scripts/ci_patch_path_deps.sh --check
          flutter pub get --enforce-lockfile
          bash .github/scripts/ci_gen_env.sh
          bash .github/scripts/ci_build_vod.sh

      - name: Inject Firebase google-services.json
        if: ${{ env.GOOGLE_SERVICES_JSON_B64 != '' }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json

      - name: Strip local dev proxy (gradle.properties 内含本机代理 127.0.0.1:7897，CI 无此代理)
        run: sed -i.bak '/systemProp.http.proxy/d;/systemProp.https.proxy/d' android/gradle.properties && rm -f android/gradle.properties.bak

      - name: Prepare release signing fallback (CI 无正式签名材料，用 debug keystore 出可安装产物)
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          {
            echo "storeFile=$HOME/.android/debug.keystore"
            echo "keyAlias=androiddebugkey"
            echo "keyPassword=android"
            echo "storePassword=android"
          } > android/key.properties

      - name: Build APK (Release)
        env:
          SENTRY_DSN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.SENTRY_DSN || '' }}
        run: |
          bash .github/scripts/ci_retry_build_downloads.sh flutter build apk --release \
            --flavor standard \
            --dart-define=SENTRY_DSN="${SENTRY_DSN:-}"

      - name: Build standard AAB (debug-signed CI smoke only)
        env:
          SENTRY_DSN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.SENTRY_DSN || '' }}
        run: |
          bash .github/scripts/ci_retry_build_downloads.sh flutter build appbundle --release --flavor standard \
            --dart-define=SENTRY_DSN="${SENTRY_DSN:-}"
          test -f build/app/outputs/bundle/standardRelease/app-standard-release.aab

      - name: Verify Android Maven repository modes (isolated fixtures)
        run: python3 .github/scripts/ci_check_android_repositories.py --artifact-dir "${RUNNER_TEMP}/android-repositories"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-standard-release.apk

  # ==================== iOS构建任务 ====================
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: [test-summary]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    env:
      GOOGLE_SERVICE_INFO_PLIST_B64: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.GOOGLE_SERVICE_INFO_PLIST_B64 || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Checkout pinned submodules (bounded retry)
        timeout-minutes: 10
        run: bash .github/scripts/ci_checkout_submodules.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Verify SDK compatibility
        run: python3 scripts/check_sdk_compatibility.py

      - name: Get dependencies
        run: |
          bash .github/scripts/ci_patch_path_deps.sh --check
          flutter pub get --enforce-lockfile
          bash .github/scripts/ci_gen_env.sh
          bash .github/scripts/ci_build_vod.sh

      - name: Inject Firebase GoogleService-Info.plist
        if: ${{ env.GOOGLE_SERVICE_INFO_PLIST_B64 != '' }}
        run: |
          echo "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 -d > ios/Runner/GoogleService-Info.plist

      - name: Update CocoaPods specs repo (Agora 等依赖要求最新 specs)
        run: pod repo update

      - name: Build iOS (Release)
        env:
          SENTRY_DSN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.SENTRY_DSN || '' }}
        run: |
          bash .github/scripts/ci_retry_build_downloads.sh flutter build ios --config-only --release --no-codesign \
            --dart-define=SENTRY_DSN="${SENTRY_DSN:-}"
          flutter build ios --release --no-codesign \
            --dart-define=SENTRY_DSN="${SENTRY_DSN:-}"

  dco-check:
    name: DCO check
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test DCO range and bot verification
        run: python3 test/tooling/test_check_pr_dco.py

      - name: DCO check（shell 实现；dco-org/dco-action 仓库已下线）
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # HEAD may be GitHub's unsigned synthetic merge, not a PR commit.
        run: bash scripts/check_pr_dco.sh

  route-smoke-test:
    name: Route Smoke Test (isolated)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: imboyapp
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          path: imboyapp
      - name: Checkout pinned submodules (bounded retry)
        timeout-minutes: 10
        run: bash .github/scripts/ci_checkout_submodules.sh
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/imboy
          path: imboy
      - name: Freeze isolated route plan
        run: python3 scripts/auto_test.py execution-plan --profile routes --platform linux --output "${{ runner.temp }}/routes-plan.json"
      - name: Install declared Linux SQLite dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsqlite3-dev
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Prepare host
        run: |
          python3 scripts/check_sdk_compatibility.py
          bash .github/scripts/ci_patch_path_deps.sh --check
          flutter pub get --enforce-lockfile
          bash .github/scripts/ci_gen_env.sh
          bash .github/scripts/ci_build_vod.sh
      - name: Run each route in its own process
        run: python3 scripts/auto_test.py execution-run --plan "${{ runner.temp }}/routes-plan.json" --artifact-dir "${{ runner.temp }}/routes"
      - name: Reconcile routes
        if: always()
        run: python3 scripts/auto_test.py execution-summary --plan "${{ runner.temp }}/routes-plan.json" --results "${{ runner.temp }}/routes" --output "${{ runner.temp }}/routes-summary.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: route-smoke-evidence
          path: |
            ${{ runner.temp }}/routes/
            ${{ runner.temp }}/routes-summary.json
