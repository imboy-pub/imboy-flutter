name: Integration Tests

on:
  push:
    branches: [main, dev, develop]
    # 此前是 monorepo 路径假设（imboyapp/** · imboy/** · script/test.env），
    # 这三个目录在本独立仓里都不存在 → push 永不触发本 workflow。
    # imboy/** 属于另一个仓库，无法在此过滤，已移除。
    paths:
      - 'lib/**'
      - 'integration_test/**'
      - 'test/**'
      - 'scripts/test.env'
      - 'pubspec.yaml'
  pull_request:
    branches: [main, dev, develop]
  workflow_dispatch:
    inputs:
      test_device:
        description: 'Test device (macos/android)'
        required: false
        default: 'macos'
      smoke_only:
        description: 'Run backend smoke only (skip Flutter tests)'
        required: false
        type: boolean
        default: false

env:
  # 与 ci.yml / core-automation.yml 保持一致。此前的 3.29.3 是 Dart 3.7，
  # 与 pubspec.yaml 的 sdk: ^3.8.0 不兼容，flutter pub get 必失败
  FLUTTER_VERSION: '3.44.8'
  TEST_DEVICE: ${{ github.event.inputs.test_device || 'macos' }}

jobs:
  # ── Job 1: 静态分析 ──
  analyze:
    name: Static Analysis
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install dependencies
        run: |
          bash .github/scripts/ci_patch_path_deps.sh
          flutter pub get
          bash .github/scripts/ci_gen_env.sh
          bash .github/scripts/ci_build_vod.sh

      - name: Flutter analyze (zero-error gate)
        # warning/info 的数量由 quality.yml 的 ratchet 统一约束；集成工作流
        # 只阻断实际 error，避免与该基线策略互相矛盾。
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Dart format check
        # 与 ci.yml 同款：范围必须是 git ls-files 而不是目录扫描 `.`。
        # `.` 会扫进 plugin/amap_flutter_location_plus（submodule）和 build/
        # 等 gitignored 生成物，submodule 里的文件属于另一个仓库、本仓改不了，
        # 这个**无 `|| true` 的硬门禁**因此会永久失败。
        run: |
          set -o pipefail
          git ls-files -z '*.dart' ':!plugin/' | xargs -0 dart format --output=none --set-exit-if-changed

  # ── Job 2: 单元测试 ──
  unit-test:
    name: Unit Tests
    runs-on: macos-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install dependencies
        run: |
          bash .github/scripts/ci_patch_path_deps.sh
          flutter pub get
          bash .github/scripts/ci_gen_env.sh
          bash .github/scripts/ci_build_vod.sh

      - name: Run unit tests
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ── Job 3: 集成测试（需要后端 + 测试账号） ──
  integration-test:
    name: Integration Tests (${{ github.event.inputs.test_device || 'macos' }})
    runs-on: macos-latest
    needs: unit-test
    if: ${{ !github.event.inputs.smoke_only || github.event.inputs.smoke_only == 'false' }}
    env:
      APP_ENV: local_office
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install dependencies
        run: |
          bash .github/scripts/ci_patch_path_deps.sh
          flutter pub get
          bash .github/scripts/ci_gen_env.sh
          bash .github/scripts/ci_build_vod.sh

      - name: Run integration tests
        run: |
          flutter test integration_test/all_tests.dart \
            --dart-define=APP_ENV=${{ env.APP_ENV }} \
            --dart-define=TEST_PHONE=${{ secrets.TEST_PHONE }} \
            --dart-define=TEST_PASSWORD=${{ secrets.TEST_PASSWORD }} \
            -d ${{ env.TEST_DEVICE }}
        continue-on-error: true
        id: integration

      - name: Collect test output
        if: always()
        run: |
          mkdir -p test_output/screenshots
          echo "integration_exit_code=${{ steps.integration.outcome }}" >> test_output/summary.env

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-output
          path: |
            test_output/
          retention-days: 14

      - name: Check integration result
        if: steps.integration.outcome == 'failure'
        run: |
          echo "::error::Integration tests failed"
          exit 1
