name: Integration Tests

# 外部条件尚未就绪：仅手动触发。默认只生成计划，不隐式连接后端或设备。
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Declared specialist profile'
        type: choice
        default: device-single
        options: [device-single, device-pair, native-ui, backend, golden, routes]
      platform:
        description: 'Target platform; choose all for complete paired topologies'
        type: choice
        default: macos
        options: [linux, macos, android, ios, web, all]
      product_profile:
        description: 'Prepared product artifact / runtime contract'
        type: choice
        default: phase1_delivery
        options: [phase1_delivery, full-selected, phase1_delivery-channel-enabled, phase1_delivery-channel-disabled]
      execute:
        description: 'Execute on a prepared isolated self-hosted runner'
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.47.5'

permissions:
  contents: read

jobs:
  plan:
    name: Specialist plan (no devices or credentials required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate ownership and produce declared instances
        env:
          PROFILE: ${{ inputs.profile }}
          PLATFORM: ${{ inputs.platform }}
          PRODUCT_PROFILE: ${{ inputs.product_profile }}
        run: |
          python3 scripts/auto_test.py execution-check
          args=(--profile "$PROFILE" --product-profile "$PRODUCT_PROFILE")
          if [[ "$PLATFORM" != "all" ]]; then args+=(--platform "$PLATFORM"); fi
          python3 scripts/auto_test.py execution-plan "${args[@]}" --output "${{ runner.temp }}/specialist-plan.json"
      - uses: actions/upload-artifact@v7
        with:
          name: specialist-plan
          path: ${{ runner.temp }}/specialist-plan.json
          if-no-files-found: error

  execute:
    name: Isolated specialist execution
    if: inputs.execute
    needs: plan
    runs-on: [self-hosted, imboy-test]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/download-artifact@v7
        with:
          name: specialist-plan
          path: ${{ runner.temp }}/specialist-plan
      - name: Verify prepared SDK
        run: python3 scripts/check_sdk_compatibility.py
      - name: Run selected targets with environment preflight
        env:
          # 只使用隔离后端与专用测试身份。设备角色及签名由该 runner 预先配置。
          IMBOY_APP_ENV: local
          IMBOY_TEST_ISOLATED: 'true'
          IMBOY_API_BASE_URL_OVERRIDE: ${{ secrets.TEST_API_BASE_URL }}
          IMBOY_WS_URL_OVERRIDE: ${{ secrets.TEST_WS_URL }}
          IMBOY_TEST_PHONE: ${{ secrets.TEST_PHONE }}
          IMBOY_TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          IMBOY_SOLIDIFIED_KEY_OVERRIDE: ${{ secrets.TEST_SOLIDIFIED_KEY }}
          IMBOY_SOLIDIFIED_KEY_IV_OVERRIDE: ${{ secrets.TEST_SOLIDIFIED_KEY_IV }}
        run: |
          # Optional separately prepared product worktree; the saved plan still
          # checks commit, all ordinary source, and real generated artifacts.
          execution_root="${IMBOY_EXECUTION_WORKTREE:-$PWD}"
          case "$execution_root" in /*) ;; *) echo 'ENV_MISSING: execution worktree must be absolute'; exit 2 ;; esac
          test "$(git -C "$execution_root" rev-parse HEAD)" = "$(git rev-parse HEAD)" || {
            echo 'ENV_MISSING: prepared worktree must match the requested commit'; exit 2;
          }
          cd "$execution_root"
          python3 scripts/auto_test.py execution-run \
            --plan "${{ runner.temp }}/specialist-plan/specialist-plan.json" \
            --artifact-dir "${{ runner.temp }}/specialist-results"
      - name: Retain results even after failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: specialist-results
          path: ${{ runner.temp }}/specialist-results/
          if-no-files-found: warn

  summary:
    name: Specialist Summary
    if: always()
    needs: [plan, execute]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: specialist-*
          path: ${{ runner.temp }}/specialist
      - name: Report planning only
        if: ${{ !inputs.execute }}
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: |
          echo 'Plan only; no business, backend, device or full-regression PASS has been issued.' >> "$GITHUB_STEP_SUMMARY"
          test "$PLAN_RESULT" = success
      - name: Reconcile selected specialist instances
        if: ${{ inputs.execute && always() }}
        env:
          UPSTREAM_JOBS: ${{ toJSON(needs) }}
        run: |
          python3 scripts/auto_test.py execution-summary \
            --plan "${{ runner.temp }}/specialist/specialist-plan/specialist-plan.json" \
            --results "${{ runner.temp }}/specialist/specialist-results" \
            --upstream-env UPSTREAM_JOBS \
            --output "${{ runner.temp }}/specialist-summary.json"
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.execute && always() }}
        with:
          name: specialist-summary
          path: ${{ runner.temp }}/specialist-summary.json
          if-no-files-found: warn
