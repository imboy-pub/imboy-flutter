name: Security Scan

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # 1: block on findings; 0: report findings only. Scanner failures still fail.
  # 1：发现问题时失败；0：仅报告问题。扫描器执行错误始终失败。
  FINDINGS_EXIT_CODE: "1"
  SEMGREP_VERSION: "1.184.0"
  TRIVY_VERSION: "v0.76.2"

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Semgrep CE
        run: python -m pip install --disable-pip-version-check "semgrep==${SEMGREP_VERSION}"

      - name: Run Semgrep
        run: |
          printf '%s\n\n' 'Dart is community-supported; the selected registry packs do not guarantee Dart-specific rules. Check the scan language table. Uninitialized submodule source is not included.' >> "$GITHUB_STEP_SUMMARY"
          mkdir -p .security-reports
          semgrep scan \
            --metrics=off \
            --disable-version-check \
            --jobs=2 \
            --timeout=15 \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/owasp-top-ten \
            --exclude=.security-reports \
            --json --output=.security-reports/semgrep.json \
            --sarif-output=.security-reports/semgrep.sarif \
            .
          test -s .security-reports/semgrep.json
          test -s .security-reports/semgrep.sarif

      - name: Summarize and enforce Semgrep findings
        if: ${{ !cancelled() && hashFiles('.security-reports/semgrep.json') != '' }}
        run: |
          python - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(".security-reports/semgrep.json").read_text())
          findings = report["results"]
          scanned = report["paths"]["scanned"]
          counts = collections.Counter(item["extra"]["severity"] for item in findings)
          severities = ("CRITICAL", "HIGH", "ERROR", "MEDIUM", "WARNING", "LOW", "INFO")
          if set(counts) - set(severities):
              raise SystemExit("Unexpected Semgrep severity; review the gate before proceeding.")
          blocking_count = sum(counts[level] for level in ("CRITICAL", "HIGH", "ERROR"))
          diagnostics = report.get("errors", [])
          coverage_warnings = [
              item for item in diagnostics
              if item.get("level") in ("warn", "warning")
          ]
          fatal_diagnostics = [
              item for item in diagnostics
              if item.get("level") not in ("warn", "warning")
          ]
          def diagnostic_type(item):
              value = item.get("type", "Unknown")
              return value[0] if isinstance(value, list) else str(value)
          warning_types = collections.Counter(map(diagnostic_type, coverage_warnings))
          summary = (
              f"### Semgrep\n\n"
              f"Scanned files: {len(scanned)}. "
              + "; ".join(f"{level}: {counts[level]}" for level in severities)
              + f". Analysis coverage warnings: {len(coverage_warnings)}"
              + f"; fatal/unknown diagnostics: {len(fatal_diagnostics)}"
              + ".\nRule severity (including legacy ERROR) is not a CVSS score.\n"
          )
          if coverage_warnings:
              summary += (
                  "\nSome files or rules were not fully analyzed: "
                  + "; ".join(f"{kind}: {count}" for kind, count in sorted(warning_types.items()))
                  + ".\n"
              )
              print("::warning::Semgrep reported incomplete analysis. Review coverage warnings in the job summary.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary)
          if fatal_diagnostics or not scanned:
              raise SystemExit("Semgrep did not complete a clean, non-empty scan.")
          if blocking_count:
              print("::warning::Semgrep HIGH/CRITICAL/ERROR findings require Code scanning review.")
              raise SystemExit(int(os.environ["FINDINGS_EXIT_CODE"]))
          PY

      - name: Upload Semgrep results
        if: ${{ !cancelled() && hashFiles('.security-reports/semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: .security-reports/semgrep.sarif
          category: semgrep

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    env:
      TRIVY_INCLUDE_DEV_DEPS: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare report directory
        run: |
          printf '%s\n\n' 'Trivy reads pubspec.lock and existing Podfile.lock files. Android Gradle dependencies without a lockfile, actual SDK versions and fork contents are not fully covered.' >> "$GITHUB_STEP_SUMMARY"
          mkdir -p .security-reports

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: sarif
          output: .security-reports/trivy.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: ${{ env.FINDINGS_EXIT_CODE }}
          ignore-unfixed: false
          skip-dirs: .git,.security-reports
          cache: false
          cache-dir: ${{ runner.temp }}/trivy-cache
          timeout: 10m

      - name: Verify Trivy report
        run: test -s .security-reports/trivy.sarif

      - name: Upload Trivy results
        if: ${{ !cancelled() && hashFiles('.security-reports/trivy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: .security-reports/trivy.sarif
          category: trivy

  security-scan:
    name: security-scan
    if: ${{ always() }}
    needs: [semgrep, trivy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      SEMGREP_RESULT: ${{ needs.semgrep.result }}
      TRIVY_RESULT: ${{ needs.trivy.result }}
    steps:
      - name: Require both scanners to succeed
        run: |
          printf 'Semgrep: %s\nTrivy: %s\n' "$SEMGREP_RESULT" "$TRIVY_RESULT"
          if [[ "$SEMGREP_RESULT" != "success" || "$TRIVY_RESULT" != "success" ]]; then
            echo "::error::Security scanning failed, was cancelled, or did not run."
            exit 1
          fi
