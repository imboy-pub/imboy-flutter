version: 2
updates:
  # Flutter / pub 依赖
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # semgrep dependabot-missing-cooldown: 新发布包冷却 7 天，防投毒/不稳定版本
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "flutter"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # semgrep dependabot-missing-cooldown: 新发布 action 冷却 7 天，防投毒/不稳定版本
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"
